<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DemenCure - Sequence Recall</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            color: #172554;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(112, 91, 255, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(139, 92, 246, 0.10),
                    transparent 30%
                ),
                #f5f6fb;

        }


        /* =========================
           HEADER
        ========================== */

        header {

            height: 80px;

            background: rgba(255,255,255,0.95);

            border-bottom: 1px solid #eeeeff;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 5%;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .logo {

            width: 46px;

            height: 46px;

            border-radius: 14px;

            background: #eeecff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

        }


        .brand-name {

            font-size: 24px;

            font-weight: 700;

        }


        .back-btn {

            text-decoration: none;

            color: #5746e8;

            background: #f0efff;

            padding: 11px 18px;

            border-radius: 12px;

            font-weight: 600;

        }


        /* =========================
           MAIN
        ========================== */

        main {

            width: 92%;

            max-width: 900px;

            margin: 40px auto 70px;

        }


        /* =========================
           HERO
        ========================== */

        .hero {

            background:
                linear-gradient(
                    120deg,
                    #4538d8,
                    #6657ee,
                    #9864ee
                );

            color: white;

            border-radius: 28px;

            padding: 38px;

            text-align: center;

            margin-bottom: 25px;

            box-shadow:
                0 18px 45px
                rgba(83,70,220,0.20);

        }


        .hero-label {

            font-size: 12px;

            letter-spacing: 2px;

            font-weight: 700;

            opacity: 0.8;

            margin-bottom: 10px;

        }


        .hero h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }


        .hero p {

            opacity: 0.9;

            font-size: 16px;

        }


        /* =========================
           GAME CARD
        ========================== */

        .game-card {

            background: white;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 12px 35px
                rgba(20,30,80,0.07);

            text-align: center;

        }


        .round-info {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .round {

            font-size: 15px;

            font-weight: 700;

            color: #5944e9;

        }


        .score {

            font-size: 15px;

            font-weight: 600;

            color: #64748b;

        }


        .instruction {

            color: #64748b;

            font-size: 15px;

            margin-bottom: 25px;

        }


        /* =========================
           SEQUENCE DISPLAY
        ========================== */

        .sequence {

            min-height: 110px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 25px;

        }


        .sequence-item {

            width: 75px;

            height: 75px;

            border-radius: 18px;

            background: #f1efff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 5px 15px
                rgba(60,50,150,0.08);

        }


        /* =========================
           CHOICE AREA
        ========================== */

        .choices {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-top: 15px;

        }


        .choice {

            width: 78px;

            height: 78px;

            border: 2px solid #e6e5f5;

            background: white;

            border-radius: 18px;

            font-size: 38px;

            cursor: pointer;

            transition: 0.2s;

        }


        .choice:hover {

            transform: translateY(-3px);

            border-color: #6956eb;

            background: #f8f7ff;

        }


        .choice.selected {

            border-color: #5944e9;

            background: #eeebff;

            transform: scale(0.95);

        }


        .choice.correct {

            border-color: #16a34a;

            background: #dcfce7;

        }


        .choice.wrong {

            border-color: #dc2626;

            background: #fee2e2;

        }


        /* =========================
           BUTTON
        ========================== */

        .game-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #5944e9,
                    #823cf0
                );

            color: white;

            padding: 14px 28px;

            border-radius: 13px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 25px;

            box-shadow:
                0 8px 20px
                rgba(91,70,230,0.22);

            transition: 0.2s;

        }


        .game-btn:hover {

            transform: translateY(-2px);

        }


        .game-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           MESSAGE
        ========================== */

        .message {

            min-height: 25px;

            margin-top: 20px;

            font-weight: 600;

        }


        .message.success {

            color: #15803d;

        }


        .message.error {

            color: #dc2626;

        }


        /* =========================
           RESULT
        ========================== */

        .result {

            display: none;

            text-align: center;

        }


        .result-icon {

            font-size: 55px;

            margin-bottom: 15px;

        }


        .result h2 {

            font-size: 30px;

            margin-bottom: 10px;

        }


        .result p {

            color: #64748b;

            margin-bottom: 25px;

        }


        .result-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin: 25px 0;

        }


        .result-box {

            background: #f7f7ff;

            border-radius: 17px;

            padding: 20px;

        }


        .result-box strong {

            display: block;

            font-size: 25px;

            color: #5944e9;

            margin-bottom: 5px;

        }


        .result-box span {

            font-size: 13px;

            color: #64748b;

        }


        .round-results {

            margin-top: 25px;

            text-align: left;

        }


        .round-result {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 14px 16px;

            background: #fafaff;

            border-radius: 12px;

            margin-bottom: 8px;

        }


        .round-result.correct-round {

            color: #15803d;

        }


        .round-result.wrong-round {

            color: #dc2626;

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            header {

                height: 70px;

                padding: 0 18px;

            }


            .brand-name {

                font-size: 20px;

            }


            .logo {

                width: 40px;

                height: 40px;

            }


            .back-btn {

                padding: 9px 12px;

                font-size: 13px;

            }


            main {

                width: 94%;

                margin-top: 25px;

            }


            .hero {

                padding: 30px 20px;

                border-radius: 22px;

            }


            .hero h1 {

                font-size: 30px;

            }


            .hero p {

                font-size: 14px;

            }


            .game-card {

                padding: 25px 18px;

                border-radius: 22px;

            }


            .sequence-item {

                width: 62px;

                height: 62px;

                font-size: 31px;

            }


            .choice {

                width: 64px;

                height: 64px;

                font-size: 31px;

            }


            .result-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="brand">

            <div class="logo">
                🧠
            </div>

            <div class="brand-name">
                DemenCure
            </div>

        </div>


        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </header>



    <main>


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <div class="hero-label">
                COGNITIVE GAME
            </div>

            <h1>
                Sequence Recall
            </h1>

            <p>
                Remember the order and select the items correctly.
            </p>

        </section>



        <!-- =========================
             GAME
        ========================== -->

        <section class="game-card" id="gameArea">


            <div class="round-info">

                <div
                    class="round"
                    id="roundText"
                >
                    Round 1 of 3
                </div>

                <div
                    class="score"
                    id="scoreText"
                >
                    Score: 0
                </div>

            </div>


            <p
                class="instruction"
                id="instruction"
            >
                Remember the sequence.
            </p>


            <!-- Sequence -->

            <div
                class="sequence"
                id="sequence"
            ></div>


            <!-- Choices -->

            <div
                class="choices"
                id="choices"
            ></div>


            <div
                class="message"
                id="message"
            ></div>


            <button
                class="game-btn"
                id="startBtn"
                onclick="startRound()"
            >
                Start Round
            </button>


            <button
                class="game-btn"
                id="submitBtn"
                onclick="submitAnswer()"
                style="display:none;"
            >
                Submit Answer
            </button>


        </section>



        <!-- =========================
             RESULT
        ========================== -->

        <section
            class="game-card result"
            id="resultArea"
        >

            <div class="result-icon">
                🧠
            </div>

            <h2>
                Game Complete
            </h2>

            <p>
                Here is your Sequence Recall result.
            </p>


            <div class="result-grid">


                <div class="result-box">

                    <strong id="finalScore">
                        0/3
                    </strong>

                    <span>
                        Correct Rounds
                    </span>

                </div>


                <div class="result-box">

                    <strong id="finalAccuracy">
                        0%
                    </strong>

                    <span>
                        Accuracy
                    </span>

                </div>


                <div class="result-box">

                    <strong id="finalTotal">
                        3
                    </strong>

                    <span>
                        Total Rounds
                    </span>

                </div>


            </div>


            <div
                class="round-results"
                id="roundResults"
            ></div>


            <button
                class="game-btn"
                onclick="restartGame()"
            >
                Play Again
            </button>


        </section>


    </main>


<script type="module">

    /* =========================
       FIREBASE
    ========================== */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

   import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */
const firebaseConfig = {
    apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
    authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
    projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
    storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
    messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
    appId: import.meta.env.VITE_FIREBASE_APP_ID
};


    /* =========================
       INITIALIZE FIREBASE
    ========================== */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    /* =========================
       CURRENT USER
    ========================== */

    let currentUser = null;


    onAuthStateChanged(
        auth,
        (user) => {

            if (user) {

                currentUser = user;

                console.log(
                    "Sequence Game User:",
                    currentUser.uid
                );

            }
            else {

                window.location.href =
                    "login.html";

            }

        }
    );


    /* =========================
       GAME DATA
    ========================== */

    const emojis = [

        "🍎",
        "🌸",
        "⭐",
        "☕",
        "🔑",
        "🎵",
        "🌳",
        "🐦",
        "❤️",
        "📚",
        "🍀",
        "☀️"

    ];


    let currentRound = 1;

    let score = 0;

    let sequence = [];

    let userSequence = [];

    let roundResults = [];


    const roundLengths = {

        1: 3,

        2: 4,

        3: 5

    };


    /* =========================
       SAVE PROGRESS
    ========================== */

   /* =========================
   SAVE SEQUENCE GAME RESULT
========================= */

async function saveProgress() {

    if (!currentUser) {

        console.error("No logged-in user found.");

        return;

    }

    const total = 3;

    const accuracy =
        Math.round((score / total) * 100);


    try {

        await addDoc(
            collection(db, "gameResults"),
            {

                userId: currentUser.uid,

                game: "sequence-recall",

                score: score,

                total: total,

                accuracy: accuracy,

                playedAt: serverTimestamp()

            }
        );


        console.log(
            "Sequence Recall result saved successfully."
        );


    } catch (error) {

        console.error(
            "Error saving Sequence Recall result:",
            error
        );

        alert(
            "The result could not be saved."
        );

    }

}


    /* =========================
       RANDOM EMOJIS
    ========================== */

    function getRandomEmojis(count) {

        const shuffled =
            [...emojis].sort(
                () =>
                    Math.random() - 0.5
            );


        return shuffled.slice(
            0,
            count
        );

    }


    /* =========================
       START ROUND
    ========================== */

    window.startRound = function () {

        document.getElementById(
            "startBtn"
        ).style.display =
            "none";


        document.getElementById(
            "submitBtn"
        ).style.display =
            "none";


        document.getElementById(
            "message"
        ).textContent =
            "";


        document.getElementById(
            "message"
        ).className =
            "message";


        document.getElementById(
            "instruction"
        ).textContent =
            "Remember the sequence...";


        document.getElementById(
            "roundText"
        ).textContent =
            `Round ${currentRound} of 3`;


        sequence =
            getRandomEmojis(
                roundLengths[currentRound]
            );


        userSequence = [];


        showSequence();

    };


    /* =========================
       SHOW SEQUENCE
    ========================== */

    function showSequence() {

        const sequenceArea =
            document.getElementById(
                "sequence"
            );


        sequenceArea.innerHTML =
            "";


        sequence.forEach(
            emoji => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "sequence-item";


                item.textContent =
                    emoji;


                sequenceArea.appendChild(
                    item
                );

            }
        );


        const displayTime =
            1800 +
            (
                sequence.length *
                450
            );


        setTimeout(
            hideSequence,
            displayTime
        );

    }


    /* =========================
       HIDE SEQUENCE
    ========================== */

    function hideSequence() {

        document.getElementById(
            "sequence"
        ).innerHTML =
            "";


        document.getElementById(
            "instruction"
        ).textContent =
            "Select the emojis in the same order.";


        showChoices();

    }


    /* =========================
       SHOW CHOICES
    ========================== */

    function showChoices() {

        const choicesArea =
            document.getElementById(
                "choices"
            );


        choicesArea.innerHTML =
            "";


        const choices =
            getRandomEmojis(
                emojis.length
            );


        /*
         * Make sure every emoji
         * from the sequence exists.
         */

        sequence.forEach(
            emoji => {

                if (
                    !choices.includes(
                        emoji
                    )
                ) {

                    choices[
                        Math.floor(
                            Math.random() *
                            choices.length
                        )
                    ] = emoji;

                }

            }
        );


        choices
            .sort(
                () =>
                    Math.random() - 0.5
            )
            .forEach(
                emoji => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "choice";


                    button.textContent =
                        emoji;


                    button.onclick =
                        () =>
                            selectEmoji(
                                emoji,
                                button
                            );


                    choicesArea.appendChild(
                        button
                    );

                }
            );


        document.getElementById(
            "submitBtn"
        ).style.display =
            "inline-block";

    }


    /* =========================
       SELECT EMOJI
    ========================== */

    function selectEmoji(
        emoji,
        button
    ) {

        if (
            userSequence.length >=
            sequence.length
        ) {

            return;

        }


        userSequence.push(
            emoji
        );


        button.classList.add(
            "selected"
        );


        button.disabled =
            true;


        document.getElementById(
            "message"
        ).textContent =
            `Selected ${userSequence.length} of ${sequence.length}`;

    }


    /* =========================
       SUBMIT ANSWER
    ========================== */

    window.submitAnswer = function () {

        if (
            userSequence.length !==
            sequence.length
        ) {

            document.getElementById(
                "message"
            ).textContent =
                "Please select all items first.";


            document.getElementById(
                "message"
            ).className =
                "message error";


            return;

        }


        let correct =
            true;


        for (
            let i = 0;
            i < sequence.length;
            i++
        ) {

            if (
                sequence[i] !==
                userSequence[i]
            ) {

                correct =
                    false;

                break;

            }

        }


        if (correct) {

            score++;


            document.getElementById(
                "message"
            ).textContent =
                "Correct! Good memory.";


            document.getElementById(
                "message"
            ).className =
                "message success";

        }
        else {

            document.getElementById(
                "message"
            ).textContent =
                "Not quite. Keep practicing.";


            document.getElementById(
                "message"
            ).className =
                "message error";

        }


        roundResults.push({

            round:
                currentRound,

            correct:
                correct

        });


        document.getElementById(
            "scoreText"
        ).textContent =
            `Score: ${score}`;


        document.getElementById(
            "submitBtn"
        ).style.display =
            "none";


        document.querySelectorAll(
            ".choice"
        ).forEach(
            button => {

                button.disabled =
                    true;

            }
        );


        if (
            currentRound < 3
        ) {

            setTimeout(
                nextRound,
                1500
            );

        }
        else {

            setTimeout(
                showResult,
                1500
            );

        }

    };


    /* =========================
       NEXT ROUND
    ========================== */

    function nextRound() {

        currentRound++;


        document.getElementById(
            "startBtn"
        ).style.display =
            "inline-block";


        document.getElementById(
            "instruction"
        ).textContent =
            "Ready for the next round?";


        document.getElementById(
            "message"
        ).textContent =
            "";


        document.getElementById(
            "message"
        ).className =
            "message";


        document.getElementById(
            "choices"
        ).innerHTML =
            "";


        document.getElementById(
            "roundText"
        ).textContent =
            `Round ${currentRound} of 3`;

    }


    /* =========================
       SHOW RESULT
    ========================== */

    async function showResult() {

        document.getElementById(
            "gameArea"
        ).style.display =
            "none";


        document.getElementById(
            "resultArea"
        ).style.display =
            "block";


        const accuracy =
            Math.round(
                (score / 3) * 100
            );


        document.getElementById(
            "finalScore"
        ).textContent =
            `${score}/3`;


        document.getElementById(
            "finalAccuracy"
        ).textContent =
            `${accuracy}%`;


        document.getElementById(
            "finalTotal"
        ).textContent =
            "3";


        const resultsArea =
            document.getElementById(
                "roundResults"
            );


        resultsArea.innerHTML = `

            <h3 style="margin-bottom:12px;">
                Round Results
            </h3>

        `;


        roundResults.forEach(
            result => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "round-result " +
                    (
                        result.correct
                            ? "correct-round"
                            : "wrong-round"
                    );


                row.innerHTML = `

                    <span>
                        Round ${result.round}
                    </span>

                    <strong>
                        ${
                            result.correct
                                ? "✓ Correct"
                                : "✕ Incorrect"
                        }
                    </strong>

                `;


                resultsArea.appendChild(
                    row
                );

            }
        );


        /*
         * SAVE ONLY AFTER ALL 3 ROUNDS
         */

        await saveProgress();

    }


    /* =========================
       RESTART GAME
    ========================== */

    window.restartGame = function () {

        currentRound =
            1;


        score =
            0;


        sequence =
            [];


        userSequence =
            [];


        roundResults =
            [];


        document.getElementById(
            "resultArea"
        ).style.display =
            "none";


        document.getElementById(
            "gameArea"
        ).style.display =
            "block";


        document.getElementById(
            "roundText"
        ).textContent =
            "Round 1 of 3";


        document.getElementById(
            "scoreText"
        ).textContent =
            "Score: 0";


        document.getElementById(
            "instruction"
        ).textContent =
            "Ready? Start the first round.";


        document.getElementById(
            "message"
        ).textContent =
            "";


        document.getElementById(
            "message"
        ).className =
            "message";


        document.getElementById(
            "sequence"
        ).innerHTML =
            "";


        document.getElementById(
            "choices"
        ).innerHTML =
            "";


        document.getElementById(
            "startBtn"
        ).style.display =
            "inline-block";

    };

</script>


</body>

</html>
