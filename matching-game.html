<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DemenCure - Matching Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #172554;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            height: 80px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
        }

        .logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 12px;
        }

        .back-btn {
            text-decoration: none;
            background: #f1f3f9;
            color: #4f46e5;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #e8eaff;
        }

        /* ================= MAIN ================= */

        main {
            width: 90%;
            max-width: 1000px;
            margin: 45px auto;
        }

        /* ================= HERO ================= */

        .hero {
            background: linear-gradient(135deg,
                    #4338ca,
                    #7c3aed);

            color: white;
            padding: 45px;
            border-radius: 28px;
            margin-bottom: 30px;
            box-shadow: 0 18px 40px rgba(79, 70, 229, 0.2);
        }

        .eyebrow {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            opacity: 0.85;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 17px;
            opacity: 0.9;
        }

        /* ================= GAME CARD ================= */

        .game-card {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .status {
            color: #6b7280;
        }

        .score {
            color: #4f46e5;
        }

        .instruction {
            text-align: center;
            margin-bottom: 25px;
            color: #64748b;
            font-size: 16px;
        }

        /* ================= BOARD ================= */

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            max-width: 650px;
            margin: 0 auto 30px;
        }

        .card {
            aspect-ratio: 1 / 1;
            border: none;
            background: transparent;
            cursor: pointer;
            perspective: 800px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.35s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
        }

        .card-front {
            background: linear-gradient(135deg,
                    #4f46e5,
                    #7c3aed);

            color: white;
            font-size: 30px;
            font-weight: 700;
        }

        .card-back {
            background: #f8faff;
            border: 2px solid #e5e7eb;
            transform: rotateY(180deg);
            font-size: 42px;
        }

        .card.matched .card-back {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .card:disabled {
            cursor: default;
        }

        /* ================= BUTTON ================= */

        .button-container {
            text-align: center;
        }

        button.game-button {
            border: none;
            background: linear-gradient(135deg,
                    #4f46e5,
                    #7c3aed);

            color: white;
            padding: 13px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button.game-button:hover {
            transform: translateY(-1px);
        }

        button.game-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ================= RESULT ================= */

        .result {
            text-align: center;
            margin-top: 30px;
            padding: 30px;
            background: #fafaff;
            border-radius: 18px;
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 38px;
            color: #4f46e5;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-accuracy {
            font-size: 18px;
            color: #475569;
            margin-bottom: 8px;
        }

        .result-attempts {
            color: #64748b;
            margin-bottom: 22px;
        }

        .hidden {
            display: none;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
                height: 70px;
            }

            .brand {
                font-size: 20px;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            main {
                width: 94%;
                margin: 25px auto;
            }

            .hero {
                padding: 30px 22px;
                border-radius: 22px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 14px;
            }

            .game-card {
                padding: 22px 15px;
            }

            .game-board {
                gap: 9px;
            }

            .card-back {
                font-size: 32px;
            }

            .card-front {
                font-size: 22px;
            }

            .game-info {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="brand">

            <img src="images/logo.png" alt="DemenCure Logo" class="logo">

            <span>DemenCure</span>

        </div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- ================= HERO ================= -->

        <section class="hero">

            <div class="eyebrow">
                COGNITIVE GAME
            </div>

            <h1>
                Matching Game
            </h1>

            <p>
                Find all matching pairs by remembering
                the positions of the cards.
            </p>

        </section>


        <!-- ================= GAME ================= -->

        <section class="game-card">

            <div class="game-info">

                <div class="status" id="status">
                    Ready to play
                </div>

                <div class="score" id="scoreText">
                    Matches: 0 / 8
                </div>

            </div>


            <p class="instruction" id="instruction">
                Find and match all the pairs.
            </p>


            <!-- GAME BOARD -->

            <div class="game-board" id="gameBoard"></div>


            <!-- BUTTON -->

            <div class="button-container">

                <button class="game-button" id="startButton">
                    Start Game
                </button>

            </div>


            <!-- RESULT -->

            <div class="result hidden" id="result">

                <h2>
                    Your Result
                </h2>

                <div class="result-score" id="resultScore">
                    0 / 8
                </div>
                <div class="result-attempts" id="resultAttempts">
                    Attempts: 0
                </div>

                <button class="game-button" id="playAgainButton">
                    Play Again
                </button>

            </div>

        </section>

    </main>


    <!-- ================= FIREBASE ================= -->

    <script type="module">

        import {
            initializeApp
        } from
            "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from
            "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from
            "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        /* ================= FIREBASE CONFIG ================= */

        const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: import.meta.env.VITE_FIREBASE_APP_ID
        };


        /* ================= INITIALIZE ================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        /* ================= USER ================= */

        let currentUser = null;


        onAuthStateChanged(
            auth,
            (user) => {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;
                }

                currentUser = user;

            }
        );


        /* ================= GAME DATA ================= */

        const symbols = [

            "🧠",
            "⭐",
            "🍎",
            "🌸",
            "🔑",
            "☕",
            "🎵",
            "🌳"

        ];


        let cards = [];

        let firstCard = null;

        let secondCard = null;

        let lockBoard = false;

        let matchedPairs = 0;

        let attempts = 0;

        let gameStarted = false;


        /* ================= ELEMENTS ================= */

        const gameBoard =
            document.getElementById(
                "gameBoard"
            );

        const status =
            document.getElementById(
                "status"
            );

        const scoreText =
            document.getElementById(
                "scoreText"
            );

        const instruction =
            document.getElementById(
                "instruction"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );

        const result =
            document.getElementById(
                "result"
            );

        const resultScore =
            document.getElementById(
                "resultScore"
            );

        const resultAttempts =
            document.getElementById(
                "resultAttempts"
            );

        const playAgainButton =
            document.getElementById(
                "playAgainButton"
            );


        /* ================= SHUFFLE ================= */

        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                        array[j],
                        array[i]
                    ];

            }

            return array;
        }


        /* ================= START GAME ================= */

        function startGame() {

            if (!currentUser) {

                alert(
                    "Please wait for login to load."
                );

                return;
            }


            gameStarted = true;

            firstCard = null;

            secondCard = null;

            lockBoard = false;

            matchedPairs = 0;

            attempts = 0;


            result.classList.add(
                "hidden"
            );

            startButton.classList.add(
                "hidden"
            );


            status.textContent =
                "Game in progress";

            instruction.textContent =
                "Select two cards to find a matching pair.";


            updateScore();


            /* Create pairs */

            cards =
                shuffle([
                    ...symbols,
                    ...symbols
                ]);


            gameBoard.innerHTML = "";


            cards.forEach(
                (symbol, index) => {

                    const card =
                        document.createElement(
                            "button"
                        );

                    card.className =
                        "card";

                    card.dataset.symbol =
                        symbol;

                    card.dataset.index =
                        index;

                    card.innerHTML = `

                        <div class="card-inner">

                            <div class="card-front">
                                ?
                            </div>

                            <div class="card-back">
                                ${symbol}
                            </div>

                        </div>

                    `;


                    card.addEventListener(
                        "click",
                        () => flipCard(card)
                    );


                    gameBoard.appendChild(card);

                }
            );

        }


        /* ================= FLIP CARD ================= */

        function flipCard(card) {

            if (
                lockBoard ||
                !gameStarted ||
                card.classList.contains("flipped") ||
                card.classList.contains("matched")
            ) {
                return;
            }


            card.classList.add(
                "flipped"
            );


            if (!firstCard) {

                firstCard = card;

                return;

            }


            secondCard = card;

            attempts++;


            checkMatch();

        }


        /* ================= CHECK MATCH ================= */

        function checkMatch() {

            const isMatch =
                firstCard.dataset.symbol ===
                secondCard.dataset.symbol;


            if (isMatch) {

                matchedPairs++;

                firstCard.classList.add(
                    "matched"
                );

                secondCard.classList.add(
                    "matched"
                );


                firstCard.disabled = true;

                secondCard.disabled = true;


                resetCards();

                updateScore();


                if (
                    matchedPairs ===
                    symbols.length
                ) {

                    finishGame();

                }

            } else {

                lockBoard = true;


                setTimeout(
                    () => {

                        firstCard.classList.remove(
                            "flipped"
                        );

                        secondCard.classList.remove(
                            "flipped"
                        );


                        resetCards();

                    },
                    850
                );

            }

        }


        /* ================= RESET CARDS ================= */

        function resetCards() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }


        /* ================= UPDATE SCORE ================= */

        function updateScore() {

            scoreText.textContent =
                `Matches: ${matchedPairs} / ${symbols.length}`;

        }


        /* ================= FINISH GAME ================= */

        async function finishGame() {

            gameStarted = false;

            lockBoard = true;


            const total =
                symbols.length;





            status.textContent =
                "Game completed";


            instruction.textContent =
                "Well done. Your result has been recorded.";


            resultScore.textContent =
                `${matchedPairs} / ${total}`;


            resultAttempts.textContent =
                `Attempts: ${attempts}`;


            result.classList.remove(
                "hidden"
            );


            await saveProgress(
                matchedPairs,
                total
            );

        }


        /* ================= SAVE FIRESTORE ================= */



async function saveProgress(
    score,
    total
) {

    if (!currentUser) {

        console.error(
            "No logged-in user."
        );

        return;

    }


    try {

        await addDoc(
            collection(
                db,
                "gameResults"
            ),
            {

                userId:
                    currentUser.uid,

                game:
                    "matching-game",

                score:
                    score,

                total:
                    total,

                attempts:
                    attempts,

                playedAt:
                    serverTimestamp()

            }
        );


        console.log(
            "Matching Game result saved successfully."
        );


    } catch (error) {

        console.error(
            "Error saving Matching Game result:",
            error
        );


        alert(
            "The result could not be saved."
        );

    }

}
        


        /* ================= BUTTONS ================= */

        startButton.addEventListener(
            "click",
            startGame
        );


        playAgainButton.addEventListener(
            "click",
            startGame
        );

    </script>

</body>

</html>
